name: Deploy

# Builds every pushed branch so changes are checked before they ship; only
# main is published, by copying dist/ to the gh-pages branch that GitHub
# Pages serves. A failed build leaves the live site as is.
on:
  push:
    branches: ['**', '!gh-pages', '!preview']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The latest branch build is kept on the preview branch so it can be checked before merging.
      - name: Keep the branch build for preview
        if: github.ref != 'refs/heads/main'
        run: |
          # Relative asset paths let the preview open from any host, such as a shared review page.
          npx vite build --base ./ --outDir preview-dist
          cd preview-dist
          git init -q -b preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin gh-pages
          git worktree add pages origin/gh-pages
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. pages/
          touch pages/.nojekyll
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
